name: shellcheck

# Lints the reference shell scripts in core/ on every push and PR.
# Severity is pinned to "error": the goal is a trustworthy green check that
# catches real bugs, not style nagging on battle-tested scripts.

on:
  push:
    paths:
      - "core/**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "core/**.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck (errors only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck --severity=error core/*.sh
